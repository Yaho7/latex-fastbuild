name: Desktop

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-14
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-14
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            bundles: dmg
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: package-${{ matrix.target }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - name: Install frontend dependencies
        run: npm ci
      - name: Build bundled engine and prepare icons
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked --no-default-features --features automation --bin texgo-engine --target "$TARGET"
          extension=''
          if [ "$RUNNER_OS" = Windows ]; then extension='.exe'; fi
          mkdir -p src-tauri/binaries
          cp "src-tauri/target/$TARGET/release/texgo-engine$extension" "src-tauri/binaries/texgo-engine-$TARGET$extension"
          npx tauri icon app-icon.svg
      - name: Build desktop installer with bundled engine
        uses: tauri-apps/tauri-action@v1
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked --bin texgo-desktop
          uploadWorkflowArtifacts: false
          uploadUpdaterJson: false
      - name: Collect installers
        run: node scripts/collect-installers.mjs '${{ matrix.target }}' '${{ matrix.platform }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop-installers/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-installers-*
          path: release
          merge-multiple: true
      - name: Generate checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum * > SHA256SUMS)
          flags=()
          if [[ "${TAG#desktop-v}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --verify-tag --draft --latest=false \
            --title "Texgo Desktop ${TAG#desktop-v}" \
            --notes 'Desktop installers include both the shadcn/ui workbench and the independent texgo-engine CLI/JSON-RPC API. No separate engine installation is needed. macOS requires 13.3+. Windows is unsigned; macOS is ad-hoc signed and not notarized. SHA256SUMS covers every installer.' "${flags[@]}"
          gh release edit "$TAG" --draft=false --latest=false
