name: Desktop

on:
  push:
    branches: [main, 'codex/**']
    tags: ['desktop-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CI: 'true'
  CARGO_TERM_COLOR: always

jobs:
  dependencies:
    name: Resolve shared Rust dependency lock
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Rust dependencies on the runner
        run: |
          if [ ! -f desktop/src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-cargo-lock
          path: desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Versions, frontend and browser preview
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check package, Cargo, Tauri and tag versions
        id: version
        run: |
          python - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path

          package = json.loads(Path('package.json').read_text())
          cargo = tomllib.loads(Path('src-tauri/Cargo.toml').read_text())
          tauri = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          versions = [package['version'], cargo['package']['version'], tauri['version']]
          version = versions[0]
          number = r'(?:0|[1-9][0-9]*)'
          identifier = rf'(?:{number}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver = rf'{number}\.{number}\.{number}(?:-{identifier}(?:\.{identifier})*)?'
          if not isinstance(version, str) or not re.fullmatch(semver, version):
              raise SystemExit('Use a SemVer version without build metadata')
          if any(item != version for item in versions):
              raise SystemExit(f'Version mismatch (package, Cargo, Tauri): {versions}')
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/') and ref != f'refs/tags/desktop-v{version}':
              raise SystemExit(f'Tag must be desktop-v{version}, got {ref}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nprerelease={str("-" in version).lower()}\n')
          PY
      - name: Install frontend dependencies (lockfile not required initially)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Preserve the shared npm lockfile before browser-tool installation
        uses: actions/upload-artifact@v4
        with:
          name: desktop-npm-lock
          path: desktop/package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Typecheck
        run: npm run check
      - name: Frontend unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install browser QA tooling on the runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1
          npx playwright install --with-deps chromium
      - name: Browser-only preview screenshots, fixture QA and optional E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          mkdir -p screenshots
          npm exec -- vite preview --host 127.0.0.1 --port 4173 --strictPort > screenshots/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL" > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat screenshots/preview.log
            exit 1
          fi
          npx playwright screenshot --browser chromium --viewport-size '1440,1000' \
            --wait-for-selector '#root > *' --wait-for-timeout 1500 --full-page \
            "$PLAYWRIGHT_BASE_URL" screenshots/browser-desktop.png
          npx playwright screenshot --browser chromium --viewport-size '390,844' \
            --wait-for-selector '#root > *' --wait-for-timeout 1500 --full-page \
            "$PLAYWRIGHT_BASE_URL" screenshots/browser-narrow.png
          node scripts/browser-qa.mjs
          npm run test:e2e --if-present
      - name: Upload browser QA evidence (not native-app evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-browser-qa
          path: |
            desktop/screenshots/
            desktop/playwright-report/
            desktop/test-results/
          if-no-files-found: warn
          retention-days: 14

  core:
    name: Rust core tests (${{ matrix.os }})
    needs: dependencies
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: desktop-cargo-lock
          path: desktop/src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: core-${{ matrix.os }}
          cache-on-failure: true
      - name: Test pure Rust core, including integration tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --package texgo-desktop --no-default-features --locked

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [frontend, core]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-14
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-14
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            bundles: dmg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: desktop-npm-lock
          path: desktop
      - uses: actions/download-artifact@v4
        with:
          name: desktop-cargo-lock
          path: desktop/src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: package-${{ matrix.target }}
          cache-on-failure: true
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 xvfb xauth
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Generate platform icons before the default-feature Tauri build
        working-directory: desktop
        run: |
          npx tauri icon app-icon.svg
          for icon in src-tauri/icons/icon.png src-tauri/icons/icon.ico src-tauri/icons/icon.icns; do
            if [ ! -s "$icon" ]; then
              echo "Missing or empty generated icon: $icon" >&2
              exit 1
            fi
          done
      # Build only: never pass tagName, releaseName or releaseId here.
      - name: Build and bundle with the official Tauri action
        uses: tauri-apps/tauri-action@v1
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          uploadWorkflowArtifacts: false
          uploadUpdaterJson: false
      - name: Linux native startup liveness only (not GUI functionality)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        env:
          TARGET: ${{ matrix.target }}
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          binary="$GITHUB_WORKSPACE/desktop/src-tauri/target/$TARGET/release/texgo-desktop"
          log="$GITHUB_WORKSPACE/desktop-native-smoke/startup.log"
          mkdir -p "$(dirname "$log")"
          if [ ! -x "$binary" ]; then
            echo "Missing executable: $binary" | tee "$log"
            exit 1
          fi
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          status=0
          (
            cd "$smoke_dir"
            xvfb-run -a timeout --signal=TERM --kill-after=5s 10s "$binary"
          ) > "$log" 2>&1 || status=$?
          cat "$log"
          echo "Startup smoke exit status: $status (expected timeout: 124)" | tee -a "$log"
          if [ "$status" -ne 124 ]; then
            echo 'Native startup exited early or failed; this check requires timeout status 124.' >&2
            exit 1
          fi
      - name: Upload Linux native startup diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-native-startup-linux-x64
          path: desktop-native-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Collect every requested installer with a unique platform name
        env:
          VERSION: ${{ needs.frontend.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path

          platform = os.environ['PLATFORM']
          root = Path('desktop/src-tauri/target') / os.environ['TARGET'] / 'release/bundle'
          formats = {
              'windows': [('nsis', '.exe')],
              'linux': [('deb', '.deb'), ('appimage', '.AppImage')],
              'macos': [('dmg', '.dmg')],
          }[platform]
          destination = Path('desktop-installers')
          destination.mkdir()
          prefix = f'texgo-desktop_{os.environ["VERSION"]}_{platform}_{os.environ["ARCH"]}__'
          for directory, suffix in formats:
              files = sorted((root / directory).glob(f'*{suffix}'))
              if not files:
                  raise SystemExit(f'Missing {platform} installer: {root / directory}/*{suffix}')
              for source in files:
                  if not source.is_file() or source.stat().st_size == 0:
                      raise SystemExit(f'Invalid installer: {source}')
                  target = destination / (prefix + source.name)
                  if target.exists():
                      raise SystemExit(f'Duplicate installer: {target}')
                  shutil.copy2(source, target)
                  print(target)
          PY
      - name: Upload installers (no GitHub Release yet)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundles-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop-installers/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Verify all installers and publish desktop release
    needs: [frontend, core, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-bundles-*
          path: downloaded
          merge-multiple: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify matrix completeness, platform filenames and checksums
        env:
          VERSION: ${{ needs.frontend.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib, os, shutil
          from pathlib import Path

          expected = {
              'windows-x64': {'.exe'},
              'linux-x64': {'.deb', '.AppImage'},
              'macos-arm64': {'.dmg'},
              'macos-x64': {'.dmg'},
          }
          root, release = Path('downloaded'), Path('release')
          if {p.name for p in root.iterdir()} != {f'desktop-bundles-{key}' for key in expected}:
              raise SystemExit('Missing or unexpected matrix artifact directories')
          release.mkdir()
          for key, suffixes in expected.items():
              platform, arch = key.split('-')
              prefix = f'texgo-desktop_{os.environ["VERSION"]}_{platform}_{arch}__'
              found = set()
              for source in sorted((root / f'desktop-bundles-{key}').iterdir()):
                  if (not source.is_file() or source.is_symlink() or source.stat().st_size == 0
                      or not source.name.startswith(prefix) or source.suffix not in suffixes
                      or any(c in source.name for c in '\r\n\\')):
                      raise SystemExit(f'Unexpected installer: {source}')
                  target = release / source.name
                  if target.exists():
                      raise SystemExit(f'Duplicate release filename: {source.name}')
                  shutil.copy2(source, target)
                  found.add(source.suffix)
              if found != suffixes:
                  raise SystemExit(f'Missing installer formats for {key}: {suffixes - found}')
          with (release / 'SHA256SUMS').open('w', encoding='ascii') as sums:
              for path in sorted(release.iterdir()):
                  if path.name != 'SHA256SUMS':
                      with path.open('rb') as binary:
                          digest = hashlib.file_digest(binary, 'sha256').hexdigest()
                      sums.write(f'{digest}  {path.name}\n')
          PY
          (cd release && sha256sum --check SHA256SUMS)
      - name: Archive the complete verified release set
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ needs.frontend.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Create draft with all files, then publish (never replace assets)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.frontend.outputs.prerelease }}
        run: |
          cat > release-notes.md <<'NOTES'
          Desktop installers for Windows x64 (NSIS), Linux x64 (Debian/AppImage),
          and macOS Apple Silicon/Intel (DMG). Check SHA256SUMS before installing.

          These builds have no trusted Windows publisher signature and macOS builds
          are ad-hoc signed, not Developer ID signed or notarized. OS security
          warnings or installation blocks are expected. Do not disable OS protections.

          Browser QA includes explicitly mocked native-bridge fixtures with real
          browser image/PDF rendering. Linux startup smoke checks liveness only.
          Neither proves native GUI workflows, installation or TeX compilation.
          See docs/desktop-release.md in the tagged source.
          License: MIT (see LICENSE in the tagged source).
          NOTES
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --verify-tag --draft --latest=false \
            --title "texgo Desktop ${TAG#desktop-v}" --notes-file release-notes.md "${flags[@]}"
          gh release edit "$TAG" --draft=false --latest=false
