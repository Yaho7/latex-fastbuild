name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            asset_os: linux
            goarch: amd64
            ext: ""
          - goos: linux
            asset_os: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            asset_os: macos
            goarch: amd64
            ext: ""
          - goos: darwin
            asset_os: macos
            goarch: arm64
            ext: ""
          - goos: windows
            asset_os: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            asset_os: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/texgo-${{ matrix.asset_os }}-${GOARCH}${{ matrix.ext }}" ./cmd/texgo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: texgo-${{ matrix.asset_os }}-${{ matrix.goarch }}
          path: dist/texgo-${{ matrix.asset_os }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/texgo-*
