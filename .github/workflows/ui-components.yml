name: UI Components

on:
  push:
    branches: ['codex/**']
    paths: ['.github/workflows/ui-components.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadcn:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install design-system tooling on the runner only
        run: npm install tailwindcss @tailwindcss/vite class-variance-authority clsx tailwind-merge tw-animate-css
      - name: Inspect official shadcn registry and component documentation
        run: |
          npx shadcn@latest info --json
          npx shadcn@latest docs button badge checkbox dialog tabs tooltip toggle-group input input-group select native-select field empty separator progress skeleton table alert
      - name: Generate official components and resolved dependency lock
        run: npx shadcn@latest add button badge checkbox dialog tabs tooltip toggle-group input input-group select native-select field empty separator progress skeleton table alert --yes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadcn-ui-source
          path: |
            desktop/src/components/ui/
            desktop/src/lib/
            desktop/src/theme.css
            desktop/package.json
            desktop/package-lock.json
            desktop/components.json
          if-no-files-found: error
